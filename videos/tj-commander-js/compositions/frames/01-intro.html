<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <div
        id="root"
        data-composition-id="01-intro"
        data-width="1080"
        data-height="1920"
        data-duration="6.432"
      >
        <style>
          /* Impact is OS-bundled; local() declaration satisfies the font_face lint. */
          @font-face {
            font-family: "Impact";
            src: local("Impact"), local("Arial Black");
            font-weight: normal;
            font-style: normal;
          }
          /* ── Bold Poster · DARK override ─────────────────────────────────
             bg #1C1410 · ink #F5F2EF · accent #D8000F
             Portrait 1080x1920. Middle-third safe. Lyrics-always-on. */
          #root {
            position: absolute;
            inset: 0;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: #1c1410;
            color: #f5f2ef;
            font-family: Impact, "Arial Black", sans-serif;
          }
          #root * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
          }
          #stage {
            position: absolute;
            inset: 0;
          }

          /* Hairline top+bottom borders — Bold Poster field frame */
          #root::before,
          #root::after {
            content: "";
            position: absolute;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(245, 242, 239, 0.28);
            z-index: 5;
            pointer-events: none;
          }
          #root::before {
            top: 96px;
          }
          #root::after {
            bottom: 96px;
          }

          /* Subtle scan-line texture (poster feel, non-distracting) */
          #scan {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background-image: repeating-linear-gradient(
              to bottom,
              rgba(245, 242, 239, 0.035) 0px,
              rgba(245, 242, 239, 0.035) 1px,
              transparent 1px,
              transparent 4px
            );
            mix-blend-mode: screen;
            opacity: 0.55;
            z-index: 4;
          }

          /* Small type-tag markers (Bold Poster corner glyphs) */
          .tag {
            position: absolute;
            font-family: "Courier New", monospace;
            font-size: 22px;
            letter-spacing: 0.22em;
            color: rgba(245, 242, 239, 0.42);
            z-index: 6;
          }
          .tag.tl {
            top: 130px;
            left: 60px;
          }
          .tag.tr {
            top: 130px;
            right: 60px;
            color: #d8000f;
          }
          .tag.bl {
            bottom: 130px;
            left: 60px;
          }
          .tag.br {
            bottom: 130px;
            right: 60px;
            color: rgba(245, 242, 239, 0.42);
          }

          /* A PHRASE is centered vertically in the middle-third safe area. */
          .phrase {
            position: absolute;
            left: 60px;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            will-change: opacity;
            z-index: 2;
          }
          .line {
            font-family: Impact, "Arial Black", sans-serif;
            font-weight: 900;
            letter-spacing: -0.03em;
            line-height: 0.88;
            white-space: nowrap;
            text-transform: uppercase;
          }
          .line.hero {
            color: #d8000f;
            letter-spacing: -0.045em;
          }
          .line.mono {
            font-family: "Courier New", monospace;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
          }
          .line + .line {
            margin-top: 8px;
          }

          /* Climax — full title, centered, holds to the end. */
          .climax {
            position: absolute;
            left: 60px;
            right: 60px;
            top: 50%;
            transform: translate(0, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 14px;
            opacity: 0;
            z-index: 3;
            will-change: opacity, transform;
          }
          .climax .c-top {
            font-family: Impact, "Arial Black", sans-serif;
            font-weight: 900;
            font-size: 168px;
            line-height: 0.88;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: #f5f2ef;
          }
          .climax .c-hero {
            font-family: Impact, "Arial Black", sans-serif;
            font-weight: 900;
            font-size: 240px;
            line-height: 0.85;
            letter-spacing: -0.045em;
            text-transform: uppercase;
            color: #d8000f;
          }
          .climax .c-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 168px;
            height: 168px;
            color: #d8000f;
            opacity: 0;
            will-change: transform, opacity;
          }
          .climax .c-icon svg {
            width: 100%;
            height: 100%;
            display: block;
          }
        </style>

        <div id="stage">
          <div id="scan"></div>
          <div class="tag tl">TJ / SIDE A</div>
          <div class="tag tr">◆ 01</div>
          <div class="tag bl">DUCKING FASTARDS</div>
          <div class="tag br">6.4s</div>

          <!-- Phrase 1 @ 0.44s: NPM INSTALL, hero = INSTALL -->
          <div class="phrase" id="p1">
            <div class="line" style="font-size: 220px">NPM</div>
            <div class="line hero" style="font-size: 360px">INSTALL</div>
          </div>

          <!-- Phrase 2 @ 2.5s: COMMANDER (huge white) -->
          <div class="phrase" id="p2">
            <div class="line" style="font-size: 200px; color: #f5f2ef">COMMANDER</div>
          </div>

          <!-- Phrase 3 @ 4.5s: COMMA-ND.R (artist, small red, mono) -->
          <div class="phrase" id="p3">
            <div class="line mono" style="font-size: 68px; color: rgba(245,242,239,0.55)">
              ARTIST
            </div>
            <div class="line mono" style="font-size: 168px; color: #d8000f; margin-top: 22px">
              COMMA-ND.R
            </div>
          </div>

          <!-- Climax @ 6.0s: full title + bolt icon at 6.3s -->
          <div class="climax" id="climax">
            <div class="c-top">NPM INSTALL</div>
            <div class="c-hero">COMMANDER</div>
            <span class="c-icon" id="climax-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M13.2 1.8L4.4 13.6h5.6l-1.2 8.6 9.2-12.4h-5.8z" />
              </svg>
            </span>
          </div>
        </div>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};

            var root = document.getElementById("root");
            var p1 = document.getElementById("p1");
            var p2 = document.getElementById("p2");
            var p3 = document.getElementById("p3");
            var climax = document.getElementById("climax");
            var icon = document.getElementById("climax-icon");

            var tl = gsap.timeline({ paused: true });

            // Initial state: everything hidden (seek-safe: derived from time, not onStart).
            tl.set([p1, p2, p3], { autoAlpha: 0 }, 0);
            tl.set(climax, { autoAlpha: 0 }, 0);
            tl.set(icon, { autoAlpha: 0, scale: 0.9 }, 0);

            // ── Phrase 1: NPM INSTALL @ 0.44s ──
            tl.set(p1, { autoAlpha: 1 }, 0.44);

            // ── Phrase 2: COMMANDER @ 2.5s (hard-cut swap) ──
            tl.set(p1, { autoAlpha: 0 }, 2.5);
            tl.set(p2, { autoAlpha: 1 }, 2.5);

            // ── Phrase 3: COMMA-ND.R @ 4.5s (hard-cut swap) ──
            tl.set(p2, { autoAlpha: 0 }, 4.5);
            tl.set(p3, { autoAlpha: 1 }, 4.5);

            // ── Climax @ 6.0s: full title punches in ──
            tl.set(p3, { autoAlpha: 0 }, 6.0);
            tl.fromTo(
              climax,
              { autoAlpha: 0, scale: 0.96, y: 12 },
              { autoAlpha: 1, scale: 1, y: 0, duration: 0.22, ease: "power3.out", overwrite: "auto" },
              6.0,
            );

            // ── Bolt icon lands @ 6.3s: scale 0.9 → 1.0 in 0.15s ──
            tl.fromTo(
              icon,
              { autoAlpha: 0, scale: 0.9 },
              { autoAlpha: 1, scale: 1, duration: 0.15, ease: "back.out(2)", overwrite: "auto" },
              6.3,
            );

            // Hold the climax to the end of the frame.
            tl.to({}, { duration: 6.432 }, 0);

            tl.seek(0);
            window.__timelines["01-intro"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
