<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<div id="root" data-composition-id="01-intro" data-width="1080" data-height="1920" data-duration="12.000">
<style>
#root {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background-color: #0A0E12;
  display: flex;
  align-items: center;
  justify-content: center;
}

@font-face {
  font-family: 'Courier New';
  src: local('Courier New');
}

@font-face {
  font-family: 'Consolas';
  src: local('Consolas');
}

.title-container {
  position: relative;
  text-align: left;
}

.title-line {
  font-family: Courier New, Consolas, Monaco, monospace;
  font-size: 96px;
  font-weight: bold;
  letter-spacing: 0.05em;
  color: #E8F0FF;
  line-height: 1.3;
  white-space: nowrap;
  position: relative;
}

.title-line .char {
  display: inline-block;
  opacity: 0;
}

.cursor {
  display: inline-block;
  width: 4px;
  height: 96px;
  background-color: #00A8E8;
  margin-left: 8px;
  vertical-align: text-bottom;
  opacity: 0;
}

.glow {
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at center, rgba(0, 168, 232, 0.3) 0%, transparent 70%);
  opacity: 0;
  pointer-events: none;
}
</style>

<div class="clip" id="title-container" data-start="0" data-duration="12.000" data-track-index="0">
  <div class="title-container">
    <div class="title-line" id="line1">
      <span class="char">C</span><span class="char">L</span><span class="char">A</span><span class="char">U</span><span class="char">D</span><span class="char">E</span>
    </div>
    <div class="title-line" id="line2">
      <span class="char">C</span><span class="char">O</span><span class="char">D</span><span class="char">E</span>
    </div>
    <span class="cursor" id="cursor"></span>
  </div>
</div>

<div class="clip glow" id="glow-effect" data-start="0" data-duration="12.000" data-track-index="1"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function() {
  window.__timelines = window.__timelines || {};
  
  var root = document.getElementById('root');
  var titleContainer = document.getElementById('title-container');
  var line1 = document.getElementById('line1');
  var line2 = document.getElementById('line2');
  var cursor = document.getElementById('cursor');
  var glowEffect = document.getElementById('glow-effect');
  var line1Chars = line1.querySelectorAll('.char');
  var line2Chars = line2.querySelectorAll('.char');
  
  gsap.set(titleContainer, {autoAlpha: 0});
  gsap.set(glowEffect, {autoAlpha: 0});
  
  var tl = gsap.timeline({paused: true});
  
  tl.set(titleContainer, {autoAlpha: 1}, 0.05);
  tl.set(glowEffect, {autoAlpha: 1}, 0.05);
  
  tl.set(cursor, {opacity: 1}, 1.0);
  
  tl.to(line1Chars, {
    opacity: 1,
    duration: 0.05,
    stagger: 0.08,
    ease: 'none'
  }, 1.0);
  
  tl.to(line2Chars, {
    opacity: 1,
    duration: 0.05,
    stagger: 0.08,
    ease: 'none'
  }, 1.5);
  
  tl.to(cursor, {
    opacity: 0,
    duration: 0.3,
    repeat: 17,
    yoyo: true,
    ease: 'steps(1)'
  }, 1.0);
  
  tl.to(glowEffect, {
    opacity: 0.4,
    duration: 0.15,
    ease: 'power2.out'
  }, 1.0);
  tl.to(glowEffect, {
    opacity: 0,
    duration: 0.6,
    ease: 'power2.in'
  }, 1.15);
  
  tl.to(glowEffect, {
    opacity: 0.35,
    duration: 0.15,
    ease: 'power2.out'
  }, 2.8);
  tl.to(glowEffect, {
    opacity: 0,
    duration: 0.6,
    ease: 'power2.in'
  }, 2.95);
  
  tl.to(glowEffect, {
    opacity: 0.3,
    duration: 0.15,
    ease: 'power2.out'
  }, 4.6);
  tl.to(glowEffect, {
    opacity: 0,
    duration: 0.6,
    ease: 'power2.in'
  }, 4.75);
  
  tl.to(glowEffect, {
    opacity: 0.35,
    duration: 0.15,
    ease: 'power2.out'
  }, 6.4);
  tl.to(glowEffect, {
    opacity: 0,
    duration: 0.6,
    ease: 'power2.in'
  }, 6.55);
  
  tl.to(glowEffect, {
    opacity: 0.3,
    duration: 0.15,
    ease: 'power2.out'
  }, 8.2);
  tl.to(glowEffect, {
    opacity: 0,
    duration: 0.6,
    ease: 'power2.in'
  }, 8.35);
  
  tl.to(glowEffect, {
    opacity: 0.4,
    duration: 0.15,
    ease: 'power2.out'
  }, 10.0);
  tl.to(glowEffect, {
    opacity: 0,
    duration: 0.6,
    ease: 'power2.in'
  }, 10.15);
  
  tl.to([titleContainer, glowEffect], {
    opacity: 0,
    duration: 0.3,
    ease: 'power2.in'
  }, 11.7);
  
  tl.set([titleContainer, glowEffect], {opacity: 0}, 12.0);
  
  tl.seek(0);
  window.__timelines['01-intro'] = tl;
})();
</script>
</div>
</template>
</body>
</html>
