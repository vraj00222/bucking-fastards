        <!-- blackout curtain for the two hard snap-closes -->
        <div id="g1_blackout"></div>

        <script>
          (function () {
            window.__timelines = window.__timelines || {};
            const tl = gsap.timeline({ paused: true });

            // Frame-local timing (TRACK - 54.437)
            //   onsets: 0.063, 1.063, 2.063, 2.963, 3.863, 4.663
            //   hard stops: 2.563, 4.563

            const starL = "#g1_star_l";
            const starR = "#g1_star_r";
            const stackA = "#g1_stack_a";
            const stackB = "#g1_stack_b";
            const stackC = "#g1_stack_c";
            const credit = "#g1_credit";
            const black = "#g1_blackout";

            // baseline: stars joined at frame center (CSS margin-left ±140px)
            gsap.set([starL, starR], { x: 0, scale: 1, opacity: 1 });
            gsap.set([stackA, stackB, stackC], { opacity: 0, scale: 0.9 });
            gsap.set(credit, { opacity: 0, y: 20 });
            gsap.set(black, { opacity: 0 });

            // ── 0.063s: SPLIT — left star −200px, right star +200px ────
            tl.to(
              starL,
              { x: -200, duration: 0.45, ease: "power3.out" },
              0.063,
            );
            tl.to(
              starR,
              { x: 200, duration: 0.45, ease: "power3.out" },
              0.063,
            );

            // ── 1.063s: "28K" appears in the gap ───────────────────────
            tl.to(
              stackA,
              { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" },
              1.063,
            );
            // "STARS" already in stackA — reveal via inner element scale
            gsap.set("#g1_w_stars", { opacity: 0, y: 40 });
            gsap.set("#g1_w_28k", { opacity: 1 });

            // ── 2.063s: "STARS" drops in below "28K" ───────────────────
            tl.to(
              "#g1_w_stars",
              { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" },
              2.063,
            );

            // ── 2.563s: HARD SNAP-CLOSE #1 ─────────────────────────────
            // Stars snap back to center; text hides; 100ms blackout;
            // then hard cut back to the open state.
            tl.to(
              [starL, starR],
              { x: 0, duration: 0.05, ease: "power4.in" },
              2.563,
            );
            tl.to(
              stackA,
              { opacity: 0, duration: 0.05, ease: "none" },
              2.563,
            );
            tl.to(
              black,
              { opacity: 1, duration: 0.02, ease: "none" },
              2.563,
            );
            // hold blackout ~100ms, then release
            tl.to(
              black,
              { opacity: 0, duration: 0.02, ease: "none" },
              2.663,
            );
            // hard cut back to open state (stars re-split instantly)
            tl.set(starL, { x: -200 }, 2.663);
            tl.set(starR, { x: 200 }, 2.663);

            // ── 2.963s: "SKRRT" (red) replaces the "28K/STARS" stack ───
            gsap.set("#g1_w_skrrt2", { opacity: 0, y: 40 });
            tl.to(
              stackB,
              { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" },
              2.963,
            );

            // ── 3.863s: second "SKRRT" (white) appears below ───────────
            tl.to(
              "#g1_w_skrrt2",
              { opacity: 1, y: 0, duration: 0.2, ease: "power2.out" },
              3.863,
            );

            // ── 4.563s: HARD SNAP-CLOSE #2 ─────────────────────────────
            tl.to(
              [starL, starR],
              { x: 0, duration: 0.05, ease: "power4.in" },
              4.563,
            );
            tl.to(
              stackB,
              { opacity: 0, duration: 0.05, ease: "none" },
              4.563,
            );
            tl.to(
              black,
              { opacity: 1, duration: 0.02, ease: "none" },
              4.563,
            );
            tl.to(
              black,
              { opacity: 0, duration: 0.02, ease: "none" },
              4.663,
            );
            // hard cut back to open state
            tl.set(starL, { x: -200 }, 4.663);
            tl.set(starR, { x: 200 }, 4.663);

            // ── 4.663s: final HOLD — 3× SKRRT stack + credit line ──────
            tl.to(
              stackC,
              { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" },
              4.663,
            );
            tl.to(
              credit,
              { opacity: 0.75, y: 0, duration: 0.25, ease: "power2.out" },
              4.663,
            );

            // ── star pulses on every beat (0.5, 1.5, 2.5, 3.5, 4.5) ────
            const beats = [0.5, 1.5, 2.5, 3.5, 4.5];
            beats.forEach(function (t) {
              tl.to(
                [starL, starR],
                { scale: 1.1, duration: 0.1, ease: "power2.out" },
                t,
              );
              tl.to(
                [starL, starR],
                { scale: 1.0, duration: 0.1, ease: "power2.in" },
                t + 0.1,
              );
            });

            window.__timelines["06-outro-skrrt"] = tl;
            tl.seek(0);
          })();
        </script>
