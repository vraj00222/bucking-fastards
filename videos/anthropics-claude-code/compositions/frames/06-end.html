<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<div id="root" data-composition-id="06-end" data-width="1080" data-height="1920" data-duration="4.000">
<style>
#root {
  position: absolute;
  inset: 0;
  width: 1080px;
  height: 1920px;
  overflow: hidden;
  background-color: #0A0E12;
}

@font-face {
  font-family: 'Courier New';
  src: local('Courier New');
}

@font-face {
  font-family: 'Consolas';
  src: local('Consolas');
}

@font-face {
  font-family: 'Monaco';
  src: local('Monaco');
}

.credit {
  position: absolute;
  left: 50%;
  bottom: 120px;
  font-family: Courier New, Consolas, Monaco, monospace;
  font-size: 18px;
  letter-spacing: 4px;
  color: #4A5568;
  text-align: center;
  white-space: nowrap;
}
</style>

<div id="credit-text" class="clip credit" data-start="0" data-duration="4.000" data-track-index="0">ANTHROPICS</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
<script>
(function () {
  window.__timelines = window.__timelines || {};
  
  var creditEl = document.getElementById('credit-text');
  
  gsap.set(creditEl, {
    autoAlpha: 0,
    xPercent: -50
  });
  
  var tl = gsap.timeline({ paused: true });
  
  tl.to(creditEl, {
    autoAlpha: 1,
    duration: 0.8,
    ease: 'power2.inOut'
  }, 0.05);
  
  tl.to(creditEl, {
    opacity: 0,
    duration: 0.3,
    ease: 'power2.in'
  }, 3.7);
  
  tl.set(creditEl, {
    opacity: 0
  }, 4.000);
  
  tl.seek(0);
  window.__timelines["06-end"] = tl;
})();
</script>
</div>
</template>
</body>
</html>
