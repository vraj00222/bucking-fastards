<script>
(function() {
  var root = document.querySelector('#root');
  var heroTitle = document.getElementById('hero-title');
  var splitLeft = document.getElementById('split-left');
  var splitRight = document.getElementById('split-right');
  var scanlines = document.getElementById('scanlines');
  var glitchOverlay = document.getElementById('glitch-overlay');
  var particleContainer = document.getElementById('particle-container');
  var freezeFrame = document.getElementById('freeze-frame');
  var accentFlash = document.getElementById('accent-flash');
  var subBassPulse = document.getElementById('sub-bass-pulse');
  var bar1 = document.getElementById('energy-bar-1');
  var bar2 = document.getElementById('energy-bar-2');
  var bar3 = document.getElementById('energy-bar-3');
  var bar4 = document.getElementById('energy-bar-4');

  gsap.set(heroTitle, {xPercent: -50, yPercent: -50, autoAlpha: 0});
  gsap.set(splitLeft, {autoAlpha: 0});
  gsap.set(splitRight, {autoAlpha: 0});
  gsap.set(scanlines, {autoAlpha: 0});
  gsap.set(glitchOverlay, {autoAlpha: 0});
  gsap.set(particleContainer, {autoAlpha: 0});
  gsap.set(freezeFrame, {autoAlpha: 0});
  gsap.set(accentFlash, {autoAlpha: 0});
  gsap.set(subBassPulse, {xPercent: -50, yPercent: -50, scale: 0, autoAlpha: 0});
  gsap.set([bar1, bar2, bar3, bar4], {autoAlpha: 0});

  var particles = [];
  for (var i = 0; i < 50; i++) {
    var particle = document.createElement('div');
    particle.className = 'particle';
    particleContainer.appendChild(particle);
    particles.push(particle);
    gsap.set(particle, {x: 540, y: 960, autoAlpha: 0});
  }

  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({paused: true});

  tl.to(heroTitle, {autoAlpha: 1, duration: 0.05}, 0.05);
  tl.to(subBassPulse, {autoAlpha: 0.6, duration: 0.05}, 0.05);
  tl.to([bar1, bar2, bar3, bar4], {autoAlpha: 1, duration: 0.05}, 0.05);

  tl.to(heroTitle, {scale: 1.1, duration: 0.3, ease: 'power2.out'}, 0.1);
  tl.to(heroTitle, {scale: 1, duration: 0.2, ease: 'power2.in'}, 0.4);

  tl.to(subBassPulse, {scale: 1.2, autoAlpha: 0.8, duration: 0.6, ease: 'power1.out'}, 0.1);
  tl.to(subBassPulse, {scale: 2, autoAlpha: 0, duration: 1.2, ease: 'power1.in'}, 0.7);

  tl.to(bar1, {height: 300, duration: 0.4, ease: 'power2.out'}, 0.2);
  tl.to(bar2, {height: 450, duration: 0.5, ease: 'power2.out'}, 0.3);
  tl.to(bar3, {height: 400, duration: 0.45, ease: 'power2.out'}, 0.25);
  tl.to(bar4, {height: 350, duration: 0.42, ease: 'power2.out'}, 0.28);

  tl.to(heroTitle, {y: '-=30', duration: 0.6, ease: 'sine.inOut', yoyo: true, repeat: 1}, 2);

  tl.to(bar1, {height: 500, duration: 0.3, ease: 'power2.out'}, 3);
  tl.to(bar2, {height: 600, duration: 0.3, ease: 'power2.out'}, 3.1);
  tl.to(bar3, {height: 550, duration: 0.3, ease: 'power2.out'}, 3.05);
  tl.to(bar4, {height: 520, duration: 0.3, ease: 'power2.out'}, 3.08);

  tl.to(scanlines, {autoAlpha: 0.9, duration: 0.1}, 7);
  tl.to(heroTitle, {textShadow: '0 0 60px rgba(0,217,255,1), 0 0 100px rgba(0,217,255,0.6)', duration: 0.8}, 7);

  tl.to([bar1, bar2, bar3, bar4], {height: '+=200', duration: 2, ease: 'rough({strength: 3, points: 30})', stagger: 0.05}, 7);

  tl.to(scanlines, {autoAlpha: 0, duration: 0.3}, 9);

  tl.to(splitLeft, {autoAlpha: 1, duration: 0.01}, 10);
  tl.to(splitRight, {autoAlpha: 1, duration: 0.01}, 10);
  tl.to(splitLeft, {filter: 'invert(1)', duration: 0.01}, 10);
  
  tl.to(heroTitle, {x: -20, duration: 0.05, ease: 'power4.out', overwrite: 'auto'}, 10);
  tl.to(heroTitle, {x: 20, duration: 0.05, ease: 'power4.out', overwrite: 'auto'}, 10.05);
  tl.to(heroTitle, {x: 0, duration: 0.05, ease: 'power4.out', overwrite: 'auto'}, 10.1);

  tl.to(glitchOverlay, {autoAlpha: 0.3, duration: 0.05}, 10);
  tl.to(glitchOverlay, {autoAlpha: 0, duration: 0.05}, 10.15);

  tl.to(heroTitle, {scale: 1.3, duration: 0.4, ease: 'power3.out'}, 11);

  particles.forEach(function(particle, index) {
    var angle = (index / particles.length) * Math.PI * 2;
    var distance = 200 + (index % 3) * 100;
    var targetX = 540 + Math.cos(angle) * distance;
    var targetY = 960 + Math.sin(angle) * distance;
    
    tl.to(particle, {autoAlpha: 1, duration: 0.01}, 11);
    tl.to(particle, {x: targetX, y: targetY, duration: 0.6, ease: 'power2.out'}, 11);
  });

  tl.to(heroTitle, {autoAlpha: 0, duration: 0.3}, 11.2);

  tl.to(freezeFrame, {autoAlpha: 1, duration: 0.01}, 12);
  tl.to(freezeFrame, {autoAlpha: 0, duration: 0.01}, 12.2);

  particles.forEach(function(particle) {
    tl.to(particle, {x: 540, y: 960, duration: 0.5, ease: 'power2.in'}, 12.2);
    tl.to(particle, {autoAlpha: 0, duration: 0.2}, 12.5);
  });

  tl.to(heroTitle, {autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(2)'}, 12.2);

  tl.to(splitLeft, {filter: 'invert(0)', duration: 0.01}, 12.5);
  tl.to([splitLeft, splitRight], {autoAlpha: 0, duration: 0.2}, 12.5);

  tl.to([bar1, bar2, bar3, bar4], {height: 800, duration: 0.4, ease: 'power3.out', stagger: 0.02}, 13);

  tl.to(accentFlash, {autoAlpha: 1, duration: 0.01}, 15);
  tl.to(accentFlash, {autoAlpha: 0, duration: 0.4, ease: 'power2.out'}, 15.01);

  tl.to(heroTitle, {rotation: 5, duration: 0.1}, 15);
  tl.to(heroTitle, {rotation: -5, duration: 0.1}, 15.1);
  tl.to(heroTitle, {rotation: 0, duration: 0.1}, 15.2);

  tl.to([bar1, bar2, bar3, bar4], {height: 0, duration: 0.3, ease: 'power2.in', stagger: 0.03}, 15.5);

  tl.to(root, {background: '#00D9FF', duration: 0.01}, 15);
  tl.to(heroTitle, {color: '#0A0E1A', textShadow: 'none', duration: 0.01}, 15);

  tl.to(heroTitle, {autoAlpha: 0, duration: 0.3}, 20.506);
  tl.to(subBassPulse, {autoAlpha: 0, duration: 0.3}, 20.506);
  tl.to([bar1, bar2, bar3, bar4], {autoAlpha: 0, duration: 0.3}, 20.506);
  tl.to(splitLeft, {autoAlpha: 0, duration: 0.3}, 20.506);
  tl.to(splitRight, {autoAlpha: 0, duration: 0.3}, 20.506);
  tl.to(scanlines, {autoAlpha: 0, duration: 0.3}, 20.506);

  tl.to(freezeFrame, {autoAlpha: 0, duration: 0.3}, 20.506);

  tl.set(heroTitle, {opacity: 0}, 20.806);
  tl.set(subBassPulse, {opacity: 0}, 20.806);
  tl.set([bar1, bar2, bar3, bar4], {opacity: 0}, 20.806);
  tl.set(splitLeft, {opacity: 0}, 20.806);
  tl.set(splitRight, {opacity: 0}, 20.806);
  tl.set(scanlines, {opacity: 0}, 20.806);
  tl.set(glitchOverlay, {opacity: 0}, 20.806);

  tl.set(freezeFrame, {opacity: 0}, 20.806);
