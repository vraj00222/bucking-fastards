<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <div id="root" data-composition-id="01-verse-a"
           data-width="1080" data-height="1920"
           data-duration="12.423">
        <style>
          @font-face {
            font-family: 'Menlo';
            src: local('Menlo');
          }
          @font-face {
            font-family: 'Consolas';
            src: local('Consolas');
          }
          @font-face {
            font-family: 'Monaco';
            src: local('Monaco');
          }
          @font-face {
            font-family: 'Courier New';
            src: local('Courier New');
          }

          #root {
            position: absolute;
            inset: 0;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background: #0D1117;
            font-family: Menlo, Consolas, Monaco, 'Courier New', monospace;
          }

          #footage-bed {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            z-index: 0;
          }

          #scrim {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, rgba(13, 17, 23, 0.3) 0%, rgba(13, 17, 23, 0.85) 100%);
            z-index: 1;
            pointer-events: none;
          }

          #lyric-container {
            position: absolute;
            left: 80px;
            top: 50%;
            width: 920px;
            z-index: 2;
          }

          #lyric-line {
            font-size: 58px;
            line-height: 1.3;
            color: #C9D1D9;
            font-weight: 400;
            letter-spacing: -0.02em;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9), 0 2px 8px rgba(13, 17, 23, 0.8);
            white-space: pre-wrap;
            word-wrap: break-word;
          }

          .hero-word {
            color: #58A6FF;
            font-weight: 700;
            text-shadow: 0 0 20px rgba(88, 166, 255, 0.6), 0 0 40px rgba(88, 166, 255, 0.3), 0 4px 20px rgba(0, 0, 0, 0.9);
          }

          #cursor {
            display: inline-block;
            width: 3px;
            height: 58px;
            background: #58A6FF;
            margin-left: 4px;
            vertical-align: text-bottom;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.8);
          }

          #section-tag {
            position: absolute;
            top: 40px;
            right: 40px;
            font-size: 16px;
            color: #8B949E;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            z-index: 3;
            opacity: 0;
            font-weight: 500;
          }

          #glitch-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 4;
            pointer-events: none;
            opacity: 0;
            background: repeating-linear-gradient(
              0deg,
              rgba(88, 166, 255, 0.03) 0px,
              rgba(88, 166, 255, 0.03) 2px,
              transparent 2px,
              transparent 4px
            );
          }

          #pulse-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 200px;
            height: 200px;
            border: 3px solid #58A6FF;
            border-radius: 50%;
            z-index: 1;
            opacity: 0;
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.5);
          }
        </style>

        <video id="footage-bed" class="clip" 
               src="assets/footage/01-verse-a.mp4" 
               muted playsinline
               data-start="0"
               data-duration="8.000"
               data-track-index="0"
               data-layout-allow-overlap></video>

        <div id="scrim"></div>

        <div id="pulse-ring" class="clip"
             data-start="0"
             data-duration="12.423"
             data-track-index="1"></div>

        <div id="glitch-overlay" class="clip"
             data-start="0"
             data-duration="12.423"
             data-track-index="2"></div>

        <div id="lyric-container" class="clip"
             data-start="0"
             data-duration="12.423"
             data-track-index="3">
          <div id="lyric-line">npm install <span id="hero-commander" class="hero-word">commander</span>, now I run the <span id="hero-throne" class="hero-word">throne</span><span id="cursor"></span></div>
        </div>

        <div id="section-tag" class="clip"
             data-start="0"
             data-duration="12.423"
             data-track-index="4">[verse]</div>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
        <script>
          (function () {
            window.__timelines = window.__timelines || {};

            // Initial hidden states
            gsap.set("#footage-bed", { autoAlpha: 0 });
            gsap.set("#lyric-container", { autoAlpha: 0, yPercent: -50 });
            gsap.set("#section-tag", { autoAlpha: 0 });
            gsap.set("#glitch-overlay", { autoAlpha: 0 });
            gsap.set("#pulse-ring", { autoAlpha: 0, xPercent: -50, yPercent: -50, scale: 0.5 });
            gsap.set("#hero-commander", { scale: 1 });
            gsap.set("#hero-throne", { scale: 1, y: 0 });
            gsap.set("#cursor", { opacity: 1 });

            var tl = gsap.timeline({ paused: true });

            // Footage bed fade in
            tl.to("#footage-bed", { duration: 0.4, autoAlpha: 0.35, ease: "power2.out" }, 0.05);

            // Lyric container types in
            tl.to("#lyric-container", { duration: 0.001, autoAlpha: 1 }, 0.441);

            // Cursor blink effect
            tl.to("#cursor", { duration: 0.5, opacity: 0, repeat: 23, yoyo: true, ease: "steps(1)" }, 0.441);

            // Section tag fade in
            tl.to("#section-tag", { duration: 0.5, autoAlpha: 0.6, ease: "power1.out" }, 1.2);

            // Glitch scanlines subtle flicker
            tl.to("#glitch-overlay", { duration: 0.08, autoAlpha: 0.15 }, 2.5);
            tl.to("#glitch-overlay", { duration: 0.08, autoAlpha: 0 }, 2.58);
            tl.to("#glitch-overlay", { duration: 0.05, autoAlpha: 0.12 }, 4.2);
            tl.to("#glitch-overlay", { duration: 0.05, autoAlpha: 0 }, 4.25);

            // COMMANDER glow on beat at 5s
            tl.to("#hero-commander", { 
              duration: 0.15, 
              scale: 1.08,
              textShadow: "0 0 30px rgba(88, 166, 255, 1), 0 0 60px rgba(88, 166, 255, 0.6), 0 4px 20px rgba(0, 0, 0, 0.9)",
              ease: "back.out(2)"
            }, 5.0);
            tl.to("#hero-commander", { 
              duration: 0.4, 
              scale: 1,
              textShadow: "0 0 20px rgba(88, 166, 255, 0.6), 0 0 40px rgba(88, 166, 255, 0.3), 0 4px 20px rgba(0, 0, 0, 0.9)",
              ease: "power2.out"
            }, 5.15);

            // Pulse ring on commander beat
            tl.to("#pulse-ring", { duration: 0.001, autoAlpha: 0.6, scale: 0.5 }, 5.0);
            tl.to("#pulse-ring", { duration: 1.2, scale: 2.5, autoAlpha: 0, ease: "power2.out" }, 5.001);

            // Glitch burst at 5s
            tl.to("#glitch-overlay", { duration: 0.06, autoAlpha: 0.25 }, 5.0);
            tl.to("#glitch-overlay", { duration: 0.1, autoAlpha: 0 }, 5.06);

            // THRONE slam at 11s with heavy sub punch
            tl.to("#hero-throne", { 
              duration: 0.001,
              scale: 1.25,
              y: -8,
              textShadow: "0 0 40px rgba(88, 166, 255, 1), 0 0 80px rgba(88, 166, 255, 0.8), 0 8px 30px rgba(0, 0, 0, 1)",
              ease: "power4.out"
            }, 11.0);
            tl.to("#hero-throne", { 
              duration: 0.6, 
              scale: 1,
              y: 0,
              textShadow: "0 0 20px rgba(88, 166, 255, 0.6), 0 0 40px rgba(88, 166, 255, 0.3), 0 4px 20px rgba(0, 0, 0, 0.9)",
              ease: "elastic.out(1, 0.5)"
            }, 11.001);

            // Screen shake on throne
            tl.to("#lyric-container", { duration: 0.05, x: -6 }, 11.0);
            tl.to("#lyric-container", { duration: 0.05, x: 6 }, 11.05);
            tl.to("#lyric-container", { duration: 0.05, x: -3 }, 11.1);
            tl.to("#lyric-container", { duration: 0.05, x: 0 }, 11.15);

            // Glitch blast at 11s
            tl.to("#glitch-overlay", { duration: 0.08, autoAlpha: 0.35 }, 11.0);
            tl.to("#glitch-overlay", { duration: 0.12, autoAlpha: 0 }, 11.08);

            // Pulse ring on throne
            tl.to("#pulse-ring", { duration: 0.001, autoAlpha: 0.7, scale: 0.4 }, 11.0);
            tl.to("#pulse-ring", { duration: 1.4, scale: 3.0, autoAlpha: 0, ease: "power2.out" }, 11.001);

            // Exit fade for all elements at (duration - 0.3) = 12.123s
            tl.to("#footage-bed", { duration: 0.3, opacity: 0, ease: "power2.in" }, 12.123);
            tl.to("#lyric-container", { duration: 0.3, opacity: 0, ease: "power2.in" }, 12.123);
            tl.to("#section-tag", { duration: 0.3, opacity: 0, ease: "power2.in" }, 12.123);
            tl.to("#glitch-overlay", { duration: 0.3, opacity: 0, ease: "power2.in" }, 12.123);
            tl.to("#pulse-ring", { duration: 0.3, opacity: 0, ease: "power2.in" }, 12.123);

            // Hard kill at exactly duration
            tl.set("#footage-bed", { opacity: 0 }, 12.423);
            tl.set("#lyric-container", { opacity: 0 }, 12.423);
            tl.set("#section-tag", { opacity: 0 }, 12.423);
            tl.set("#glitch-overlay", { opacity: 0 }, 12.423);
            tl.set("#pulse-ring", { opacity: 0 }, 12.423);

            tl.seek(0);
            window.__timelines["01-verse-a"] = tl;
          })();
        </script>
      </div>
    </template>
  </body>
</html>
