<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
      .frame { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="60"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-intro"
        class="frame"
        data-composition-id="01-intro"
        data-composition-src="compositions/frames/01-intro.html"
        data-start="0"
        data-duration="6.432"
        data-track-index="1"
      ></div>

      <div
        id="el-02-verse-open"
        class="frame"
        data-composition-id="02-verse-open"
        data-composition-src="compositions/frames/02-verse-open.html"
        data-start="6.432"
        data-duration="12.005"
        data-track-index="1"
      ></div>

      <div
        id="el-03-verse-body"
        class="frame"
        data-composition-id="03-verse-body"
        data-composition-src="compositions/frames/03-verse-body.html"
        data-start="18.437"
        data-duration="11.99"
        data-track-index="1"
      ></div>

      <div
        id="el-04-chorus-hook"
        class="frame"
        data-composition-id="04-chorus-hook"
        data-composition-src="compositions/frames/04-chorus-hook.html"
        data-start="30.427"
        data-duration="12.005"
        data-track-index="1"
      ></div>

      <div
        id="el-05-bridge-todos"
        class="frame"
        data-composition-id="05-bridge-todos"
        data-composition-src="compositions/frames/05-bridge-todos.html"
        data-start="42.432"
        data-duration="12.005"
        data-track-index="1"
      ></div>

      <div
        id="el-06-outro-skrrt"
        class="frame"
        data-composition-id="06-outro-skrrt"
        data-composition-src="compositions/frames/06-outro-skrrt.html"
        data-start="54.437"
        data-duration="5.563"
        data-track-index="1"
      ></div>

      <!-- BGM -->
      <audio id="el-bgm" src="assets/bgm.mp3" data-start="0" data-duration="60"
        data-track-index="11" data-volume="0.9"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
